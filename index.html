<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamerz Hub Menu</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    background:#000;
    padding:30px;
    text-align:center;
    border-bottom:3px solid #d4af37;
}

header h1{
    color:#d4af37;
    font-size:38px;
}

header p{
    color:#ddd;
    margin-top:10px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 20px;
}

.section{
    margin-bottom:40px;
}

.section h2{
    color:#d4af37;
    margin-bottom:20px;
    border-bottom:2px solid #333;
    padding-bottom:10px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid #333;
    font-size:18px;
}

.price{
    color:#d4af37;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    color:#888;
    border-top:2px solid #222;
}
</style>

</head>

<body>

<header>
<h1>Dreamerz Hub</h1>
<p>Food & Drinks Menu</p>
</header>

<div class="container">

<div class="section">
<h2>🥤 Cold Drinks</h2>

<div class="item">
<span>Pepsi</span>
<span class="price">40 EGP</span>
</div>

<div class="item">
<span>7UP</span>
<span class="price">40 EGP</span>
</div>

<div class="item">
<span>Mirinda</span>
<span class="price">40 EGP</span>
</div>

<div class="item">
<span>Water</span>
<span class="price">15 EGP</span>
</div>

</div>

<div class="section">
<h2>☕ Hot Drinks</h2>

<div class="item">
<span>Turkish Coffee</span>
<span class="price">45 EGP</span>
</div>

<div class="item">
<span>Nescafe</span>
<span class="price">50 EGP</span>
</div>

<div class="item">
<span>Tea</span>
<span class="price">35 EGP</span>
</div>

</div>

<div class="section">
<h2>🍫 Snacks</h2>

<div class="item">
<span>Snickers</span>
<span class="price">35 EGP</span>
</div>

<div class="item">
<span>Oreo</span>
<span class="price">25 EGP</span>
</div>

<div class="item">
<span>Galaxy</span>
<span class="price">35 EGP</span>
</div>

</div>

</div>

<footer>
Dreamerz Hub © 2026
</footer>

</body>
</html>
